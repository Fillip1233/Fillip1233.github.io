<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#0b1428">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
    <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
  </head>
  <body>
    <div class="meteor-field" aria-hidden="true">
      <span class="meteor"></span><span class="meteor"></span><span class="meteor"></span>
      <span class="meteor"></span><span class="meteor"></span><span class="meteor"></span>
    </div>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="navigation wrap" aria-label="Main navigation">
        <a class="wordmark" href="#about-me" aria-label="Zhenjie Lu, home">ZL<span>.</span></a>
        <div class="nav-links">
          <a href="#about-me">About</a>
          <a href="#publications">Publications</a>
          <a href="#news">News</a>
          <a href="#honors">Honors</a>
          <a href="#education">Education</a>
          <a href="#experience">Experience</a>
        </div>
      </nav>
    </header>
    <main id="main" class="wrap">{{ content }}</main>
    <footer class="site-footer wrap">
      <span>Zhenjie Lu</span>
      <span>{{ site.author.location }}</span>
      <a href="#about-me">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
    {% if site.google_analytics_id %}{% include analytics.html %}{% endif %}
  </body>
</html>
